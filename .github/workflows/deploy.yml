name: Build and deploy site

on:
  push:
    branches: [main]
  # Rebuild daily so new publications appear and adverts close after their deadline.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npx @11ty/eleventy --pathprefix="${{ steps.pages.outputs.base_path }}/"
        env:
          # Optional: add an OpenAlex API key as a repository secret for higher rate limits.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
