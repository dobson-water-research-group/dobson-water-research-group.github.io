# Group members. Each person appears on the People page under their `group`.
#
#   id:          short unique slug, used for links (e.g. projects list people by id)
#   group:       pi | postdoc | phd | masters | visitor | alumni
#   photo:       optional, a square image in src/assets/img/people/ (initials are shown otherwise)
#   orcid:       their ORCID iD. Their publications are pulled in automatically from it.
#   scholar:     optional, the user=... part of their Google Scholar profile URL
#   links:       optional, any other links (label + url)

