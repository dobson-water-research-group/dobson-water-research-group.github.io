# The Impact page, section by section, in the order shown. List items most recent first.
# Each item has a title, an optional link (url), when it happened, who it was with (optional),
# and a sentence or two of text (Markdown).

- section: Industry and government
  items:
    - title: Only rainwater into Windermere
      url: https://www.gov.uk/government/news/government-ambition-to-end-sewage-discharges-into-windermere
      when: "2026"
      who: United Utilities, Jacobs and Mott MacDonald
      text: >-
        A coalition including United Utilities, the Environment Agency and local groups wants only
        rainwater, and no treated or untreated sewage, to reach Windermere, England's largest lake.
        Barnaby was the independent assurer for the feasibility study by Jacobs and Mott MacDonald
        into what that would take.

    - title: Sewer models for Florida
      url: /software/swmmanywhere/
      when: "2025"
      who: Arup and The Nature Conservancy
      text: >-
        Arup is using SWMManywhere to build urban drainage models in Florida for The Nature
        Conservancy, with Barnaby advising.

    - title: Integrated water management across England
      url: /software/wsimod/
      when: 2022–2024
      who: Environment Agency, Greater London Authority and Greater Manchester Combined Authority
      text: >-
        WSIMOD has been used in seven commissioned studies, modelling how water supply, wastewater
        and rivers interact in places across England and Wales.

    - title: Virtual decision rooms for water planning
      url: https://nora.nerc.ac.uk/535476/1/VENTURA_GreaterManchester_BriefingNote_July2023_IssC.pdf
      when: 2021–2023
      who: Greater Manchester Combined Authority, United Utilities and the Environment Agency
      text: >-
        In the VENTURA project, a WSIMOD model of the Upper Mersey catchment sat behind a "virtual
        decision room" where planners could explore options for water-neutral growth in Greater
        Manchester. A second study covered Enfield, in London.

