- section: Policy
  items:
    - title: A national framework for water resources
      url: https://www.gov.uk/government/publications/meeting-our-future-water-needs-a-national-framework-for-water-resources
      when: 2019–2020
      who: Environment Agency
      text: >-
        National water-supply modelling from Barnaby's time at the University of Oxford fed into
        the Environment Agency's national framework, and became the main tool for combining water
        companies' modelling results to plan transfers between them. The Environment Agency sent a
        letter of thanks, and Oxford's School of Geography gave the work a recognition award.
        Read more in [*The spatial dynamics of droughts and water scarcity in England and
        Wales*](https://doi.org/10.1029/2020WR027187).
