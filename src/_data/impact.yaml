# The Impact page, section by section, in the order shown. List items most recent first.
# Each item has a title, an optional link (url), when it happened, who it was with (optional),
# and a sentence or two of text (Markdown). Describe what the models did, not who did what.

- section: Industry and government
  items:
    - title: Only rainwater into Windermere
      url: https://www.gov.uk/government/news/government-ambition-to-end-sewage-discharges-into-windermere
      when: "2026"
      who: United Utilities, Jacobs and Mott MacDonald
      text: >-
        A feasibility study of what it would take for only rainwater, and no treated or untreated
        sewage, to reach Windermere, England's largest lake. The group gave independent assurance
        of the study.

    - title: Sewer models for Florida
      url: /software/swmmanywhere/
      when: "2025"
      who: Arup and The Nature Conservancy
      text: >-
        SWMManywhere is building urban drainage models for Florida from open data on streets,
        elevation and buildings.

    - title: Integrated water management across England
      url: /software/wsimod/
      when: 2022–2025
      who: Environment Agency, Greater London Authority and Greater Manchester Combined Authority
      text: >-
        WSIMOD has modelled how water supply, wastewater and rivers interact in seven commissioned
        studies across England and Wales.

    - title: Virtual decision rooms for water planning
      url: https://nora.nerc.ac.uk/535476/1/VENTURA_GreaterManchester_BriefingNote_July2023_IssC.pdf
      when: 2021–2023
      who: VENTURA, with Imperial College London, UCL and the British Geological Survey
      text: >-
        WSIMOD powered a prototype "virtual decision room" for exploring options for water-neutral
        growth, tested in Greater Manchester and Enfield, London.

