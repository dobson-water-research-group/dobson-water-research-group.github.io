title: Dobson Water Research Group # shown in full; elsewhere in the text it is just "the group"
tagline: Open-source modelling of integrated water systems.
description: >-
  A research group at Trinity College Dublin developing open-source tools to model how urban and
  rural water systems interact, and using them to support better decisions about water quantity
  and quality.

